<!doctype html><meta charset="utf-8"><title>Showreel music</title><body><script type="module">
// 由 tools/render-music.mjs 開啟：離線混出影片配樂，回傳 16-bit 立體聲 PCM（base64）
import { LAYOUT } from '../layout.js';
import { createAudio } from '../src/audio.js';
window.__mix = async (seconds) => {
  const buf = await createAudio({ layout: LAYOUT }).renderMix(seconds);
  const L = buf.getChannelData(0), R = buf.getChannelData(1), n = buf.length;
  const pcm = new Int16Array(n * 2);
  for (let i = 0; i < n; i++) { pcm[2 * i] = Math.max(-1, Math.min(1, L[i])) * 32767; pcm[2 * i + 1] = Math.max(-1, Math.min(1, R[i])) * 32767; }
  const u8 = new Uint8Array(pcm.buffer); let s = '';
  for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode(...u8.subarray(i, i + 0x8000));
  return { sr: buf.sampleRate, b64: btoa(s) };
};
window.__ok = true;
</script>
